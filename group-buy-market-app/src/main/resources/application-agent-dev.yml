# Layer this profile on top of dev: --spring.profiles.active=dev,agent-dev
# All mutable dependencies below are isolated from the ordinary development environment.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/group_buy_market_agent_test?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'
  rabbitmq:
    addresses: localhost
    port: 5672
    username: admin
    password: admin
    virtual-host: agent-dev
    config:
      producer:
        exchange: agent_dev_group_buy_market_exchange
        topic_team_success:
          routing_key: agent-dev.topic.team_success
          queue: agent_dev_group_buy_market_queue_2_topic_team_success
        topic_team_refund:
          routing_key: agent-dev.topic.team_refund
          queue: agent_dev_group_buy_market_queue_2_topic_team_refund

redis:
  sdk:
    config:
      host: localhost
      port: 16380
      database: 0

xfg:
  wrench:
    config:
      system: group-buy-market-agent-dev
      register:
        host: localhost
        port: 16380

group-buy-market:
  jobs:
    timeout-refund:
      enabled: false
    group-buy-notify:
      enabled: false
